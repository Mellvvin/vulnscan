[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnscan"
version = "1.2.0"
description = "Finds known vulnerabilities in installed software and risky network exposure, mapped to the OWASP Top 10"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
vulnscan = "vulnscan.cli:main"

[tool.setuptools]
packages = ["vulnscan"]

[tool.setuptools.package-data]
vulnscan = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
